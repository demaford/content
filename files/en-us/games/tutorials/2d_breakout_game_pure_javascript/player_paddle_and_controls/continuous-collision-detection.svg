<svg xmlns="http://www.w3.org/2000/svg" width="500" height="340" aria-labelledby="title description" role="img" viewBox="0 0 500 340"><title id="title">Continuous collision detection</title><desc id="description">Seven overlapping, increasingly opaque rectangles move diagonally down and right. Dots mark their top-left corners along a dashed trajectory. At first contact, the mover&apos;s bottom edge touches the obstacle&apos;s top edge, and its top-left corner reaches the blue dashed region. This region extends left of the obstacle by the mover&apos;s width and above it by the mover&apos;s height.</desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#334155" stroke-width="1.5" d="M 1 1 L 9 5 L 1 9"/></marker></defs><rect width="500" height="340" fill="#fff"/><rect width="236" height="106" x="224" y="204" fill="#76ABDA" fill-opacity=".2" stroke="#76ABDA" stroke-dasharray="6 4" stroke-width="2"/><rect width="180" height="70" x="280" y="240" fill="#334155"/><g fill="#39CAC4" stroke="#39CAC4" stroke-width="2"><rect width="56" height="36" x="40" y="65" opacity=".12"/><rect width="56" height="36" x="73.095" y="88.167" opacity=".22"/><rect width="56" height="36" x="106.191" y="111.333" opacity=".32"/><rect width="56" height="36" x="139.286" y="134.5" opacity=".44"/><rect width="56" height="36" x="172.381" y="157.667" opacity=".57"/><rect width="56" height="36" x="205.476" y="180.833" opacity=".7"/><rect width="56" height="36" x="238.571" y="204" opacity=".85"/></g><path fill="none" stroke="#334155" stroke-dasharray="7 6" stroke-width="2" marker-end="url(#arrow)" d="M 40 65 L 238.5714 204"/><g fill="#39CAC4"><circle cx="40" cy="65" r="4"/><circle cx="73.095" cy="88.167" r="4"/><circle cx="106.191" cy="111.333" r="4"/><circle cx="139.286" cy="134.5" r="4"/><circle cx="172.381" cy="157.667" r="4"/><circle cx="205.476" cy="180.833" r="4"/></g><circle cx="238.571" cy="204" r="5" fill="#fff" stroke="#CA393E" stroke-width="3"/><path stroke="#CA393E" stroke-width="5" d="M 280 240 H 294.5714"/><path fill="none" stroke="#CA393E" stroke-width="1.5" d="M 164 276 H 190 L 238.5714 211"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="45" fill="#475569" font-size="14">Frame start</text><text x="60" y="281" fill="#CA393E" font-size="16" font-weight="700">First contact</text><text x="370" y="280" fill="#fff" font-size="16" text-anchor="middle">Obstacle</text></g></svg>